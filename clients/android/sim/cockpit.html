<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Inky OLED — test cockpit</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #0f1116; color: #e6e8ec; display: flex; height: 100vh;
         font: 14px/1.45 system-ui, sans-serif; }
  #stage { flex: 1 1 auto; display: flex; align-items: center; justify-content: center;
           padding: 18px; overflow: auto; }
  /* The frame renders the app at the tablet's TRUE CSS viewport (711x1138) and scales the
     whole thing down to fit the pane. Sizing the iframe itself to fit instead would change
     what 1vh means, and every measurement in this app is in vh — the layout findings would
     be about the cockpit rather than about the panel. */
  #frame { border: 10px solid #23262e; border-radius: 20px; background: #000;
           box-shadow: 0 18px 50px rgba(0,0,0,.6); overflow: hidden; }
  iframe { border: 0; display: block; border-radius: 11px; transform-origin: 0 0; }
  aside { flex: 0 0 320px; background: #151821; border-left: 1px solid #262a33;
          padding: 14px 16px 30px; overflow: auto; }
  h1 { font-size: 15px; margin: 0 0 2px; }
  .hint { color: #7f8794; font-size: 12px; margin: 0 0 14px; }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .09em; color: #8d95a3;
       margin: 16px 0 6px; font-weight: 600; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; }
  button { font: inherit; font-size: 12px; padding: 6px 10px; border-radius: 7px;
           border: 1px solid #333846; background: #1d222c; color: #d8dce3; cursor: pointer; }
  button:hover { border-color: #4a90e2; }
  button.on { background: #1c3a5e; border-color: #4a90e2; color: #cfe4ff; }
  button.go { background: #1f6f43; border-color: #2f9e60; color: #eafff2; font-weight: 600; }
  button.go:hover { border-color: #4fe08d; }
  #out { margin-top: 10px; font: 12px/1.5 ui-monospace, Menlo, monospace;
         white-space: pre-wrap; background: #10131a; border: 1px solid #262a33;
         border-radius: 8px; padding: 10px; min-height: 90px; max-height: 42vh; overflow: auto; }
  .ok { color: #6fdc7f; } .bad { color: #ff8a8a; } .warn { color: #ffd75a; }
</style>
</head>
<body>
<div id="stage"><div id="frame"><iframe id="app" src="/"></iframe></div></div>

<aside>
  <h1>Inky OLED — test cockpit</h1>
  <p class="hint">The real app, running. Click inside the frame like it is the tablet.</p>

  <h2>Orientation &amp; size</h2>
  <div class="row" id="sizes"></div>

  <h2>Weather</h2>
  <div class="row" id="weather"></div>

  <h2>Network</h2>
  <div class="row" id="net"></div>

  <h2>Home Assistant</h2>
  <div class="row" id="ha"></div>

  <h2>News feed</h2>
  <div class="row" id="news"></div>

  <h2>Air quality reading</h2>
  <div class="row" id="aqi"></div>

  <h2>Jump to screen</h2>
  <div class="row" id="screens"></div>

  <h2>Drive it</h2>
  <div class="row">
    <button class="go" data-run="sweep">Run full sweep</button>
    <button data-run="sweep-all">Sweep every scenario</button>
    <button data-run="swipeL">Swipe ←</button>
    <button data-run="swipeR">Swipe →</button>
    <button data-run="home">Dashboard</button>
    <button data-run="drift">Force drift</button>
    <button data-run="reload">Reload</button>
  </div>
  <div id="out">ready.</div>
</aside>

<script>
var out = document.getElementById("out");
function win() { return document.getElementById("app").contentWindow; }
function say(msg, cls) { out.innerHTML = '<span class="' + (cls || "") + '">' + msg + "</span>"; }

/* [label, true CSS width, true CSS height] — the tablet reports 711x1138 at dpr 2.25 */
var SIZES = [
  ["Tablet portrait", 711, 1138],
  ["Tablet landscape", 1138, 711],
  ["Phone portrait", 412, 915],
  ["Small tablet", 600, 960]
];

/* Render at the true size, then scale the frame to whatever room the pane has. */
function fit(w, h) {
  var stage = document.getElementById("stage");
  var frame = document.getElementById("frame");
  var app = document.getElementById("app");
  var pad = 40;
  var scale = Math.min((stage.clientWidth - pad) / w, (stage.clientHeight - pad) / h, 1);
  app.style.width = w + "px";
  app.style.height = h + "px";
  app.style.transform = "scale(" + scale + ")";
  frame.style.width = Math.round(w * scale) + "px";
  frame.style.height = Math.round(h * scale) + "px";
  return scale;
}
var GROUPS = {
  weather: ["live", "clear-day", "clear-night", "rain", "snow", "storm", "fog"],
  net: ["ok", "offline", "slow"],
  ha: ["demo", "live-ok", "live-401", "live-down"],
  news: ["ok", "empty", "fail"],
  aqi: ["live", "35", "85", "155", "260", "350"]
};

function buildSizes() {
  var box = document.getElementById("sizes");
  SIZES.forEach(function (s, i) {
    var b = document.createElement("button");
    b.textContent = s[0];
    if (i === 0) b.className = "on";
    b.onclick = function () {
      var scale = fit(s[1], s[2]);
      Array.prototype.forEach.call(box.children, function (c) { c.className = ""; });
      b.className = "on";
      say("rendering at " + s[1] + "x" + s[2] + " CSS px, shown at "
        + Math.round(scale * 100) + "%");
    };
    box.appendChild(b);
  });
}

function buildGroups() {
  Object.keys(GROUPS).forEach(function (key) {
    var box = document.getElementById(key);
    GROUPS[key].forEach(function (v, i) {
      var b = document.createElement("button");
      b.textContent = v;
      if (i === 0) b.className = "on";
      b.onclick = function () {
        Array.prototype.forEach.call(box.children, function (c) { c.className = ""; });
        b.className = "on";
        var w = win();
        w.SIM.set(key, v);
        /* persist so it survives the reload the scenario needs to take effect */
        w.localStorage.setItem("sim.scenario", JSON.stringify(w.SIM.scenario));

        /* Home Assistant decides demo-vs-live from CONFIG at init, so the live modes need
           a config the app can believe in. The token is a placeholder the sim answers
           without ever leaving the machine. */
        if (key === "ha") {
          if (v === "demo") w.localStorage.removeItem("sim.configOverride");
          else w.localStorage.setItem("sim.configOverride", JSON.stringify({
            homeAssistant: {
              enabled: true, baseUrl: "http://sim-home-assistant.local:8123",
              token: "sim-token", refreshSeconds: 15,
              entities: [
                { id: "sensor.living_room_temperature", label: "Living room", unit: "°F" },
                { id: "sensor.bedroom_temperature", label: "Bedroom", unit: "°F" },
                { id: "sensor.living_room_humidity", label: "Humidity", unit: "%" },
                { id: "sensor.house_power", label: "Power", unit: "W" },
                { id: "light.living_room_lamp", label: "Lamp", kind: "toggle", domain: "light" }
              ]
            }
          }));
        }

        /* Air readings need no reload either. */
        if (key === "aqi" && w.WP && w.WP.registry.air) {
          w.WP.registry.air.fetch();
          return say("air quality = " + v + " — refetching…");
        }
        /* Weather scenes need no reload — the next fetch picks them up, so ask for one. */
        if (key === "weather" && w.WP && w.WP.registry.weather) {
          w.WP.registry.weather.fetch();
          return say("weather = " + v + " — refetching…");
        }
        say(key + " = " + v + " — reloading…");
        document.getElementById("app").src = "/?t=" + Date.now();
      };
      box.appendChild(b);
    });
  });
}

function buildScreens() {
  var box = document.getElementById("screens");
  var tryFill = function () {
    var w = win();
    if (!w.WP || !w.WP.WIDGETS) return setTimeout(tryFill, 300);
    box.innerHTML = "";
    w.WP.WIDGETS.forEach(function (name) {
      var b = document.createElement("button");
      b.textContent = name;
      b.onclick = function () {
        var ww = win();
        ww.WP.panels.closeAll();
        ww.WP.panels.open(name);
        say("opened " + name);
      };
      box.appendChild(b);
    });
  };
  tryFill();
}

function render(res) {
  var f = res.findings || [];
  var head = "scenario " + JSON.stringify(res.scenario) + "\nviewport " + res.viewport
    + "\nscreens visited " + res.screensVisited + "\n\n";
  if (!f.length) return say(head + "✓ nothing wrong found", "ok");
  say(head + f.length + " finding(s):\n• " + f.join("\n• "), "bad");
}

document.querySelectorAll("[data-run]").forEach(function (b) {
  b.onclick = function () {
    var w = win();
    var what = b.getAttribute("data-run");
    if (what === "reload") { document.getElementById("app").src = "/?t=" + Date.now(); return say("reloading…"); }
    if (!w.SIM) return say("the app has not finished booting", "warn");
    if (what === "swipeL") return say("now on " + w.SIM.swipe(-160));
    if (what === "swipeR") return say("now on " + w.SIM.swipe(160));
    if (what === "home") { w.WP.panels.closeAll(); return say("dashboard"); }
    if (what === "drift") { w.WP.drift.nudge(); return say("nudged: " +
      w.getComputedStyle(w.document.getElementById("drift")).transform
      + " (room below: " + w.WP.drift.downRoom(12) + "px)"); }
    if (what === "sweep") {
      say("sweeping every screen and control…", "warn");
      return w.SIM.sweep().then(render);
    }
    if (what === "sweep-all") {
      var combos = [
        { weather: "storm", net: "ok", ha: "demo", news: "ok" },
        { weather: "clear-night", net: "ok", ha: "live-ok", news: "ok" },
        { weather: "snow", net: "ok", ha: "live-401", news: "fail" },
        { weather: "live", net: "offline", ha: "demo", news: "ok" }
      ];
      var all = [];
      var chain = Promise.resolve();
      combos.forEach(function (c, i) {
        chain = chain.then(function () {
          say("scenario " + (i + 1) + " of " + combos.length + ": " + JSON.stringify(c), "warn");
          Object.keys(c).forEach(function (k) { w.SIM.set(k, c[k]); });
          return w.SIM.sweep();
        }).then(function (r) { all.push(r); });
      });
      return chain.then(function () {
        var txt = all.map(function (r) {
          return JSON.stringify(r.scenario) + "\n  "
            + (r.findings.length ? r.findings.join("\n  ") : "✓ clean");
        }).join("\n\n");
        var bad = all.some(function (r) { return r.findings.length; });
        say(txt, bad ? "bad" : "ok");
      });
    }
  };
});

buildSizes(); buildGroups(); buildScreens();
fit(SIZES[0][1], SIZES[0][2]);
window.addEventListener("resize", function () {
  var on = document.querySelector("#sizes .on");
  var s = SIZES[Array.prototype.indexOf.call(document.getElementById("sizes").children, on)] || SIZES[0];
  fit(s[1], s[2]);
});
document.getElementById("app").addEventListener("load", buildScreens);
</script>
</body>
</html>
