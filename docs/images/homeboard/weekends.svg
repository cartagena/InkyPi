<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img" aria-label="Weekends screen mockup: six weekend rows showing free, partly booked and booked days">
<rect x="0" y="0" width="800" height="480" fill="#FFFFFF"/>

<text x="20" y="38" font-family="sans-serif" font-size="27" font-weight="600" fill="#000000">Weekends</text>
<text x="780" y="38" font-family="sans-serif" font-size="17" fill="#000000" text-anchor="end">3 free weekends in the next 6</text>
<line x1="20" y1="53" x2="780" y2="53" stroke="#000000" stroke-width="1"/>
<text x="163" y="75" font-family="sans-serif" font-size="17" font-weight="600" fill="#000000">Saturday</text>
<text x="488" y="75" font-family="sans-serif" font-size="17" font-weight="600" fill="#000000">Sunday</text>

<!-- Long weekend: the accent date is the whole signal on a free row. -->
<text x="20" y="118" font-family="sans-serif" font-size="20" font-weight="600" fill="#1E1EAE">Sep 5</text>
<rect x="150" y="85" width="315" height="53" fill="#FFFFFF" stroke="#1DAD23" stroke-width="1"/>
<text x="165" y="118" font-family="sans-serif" font-size="20" fill="#1DAD23">Free</text>
<rect x="475" y="85" width="305" height="53" fill="#FFFFFF" stroke="#1DAD23" stroke-width="1"/>
<text x="490" y="118" font-family="sans-serif" font-size="20" fill="#1DAD23">Free</text>

<text x="20" y="177" font-family="sans-serif" font-size="20" fill="#000000">Sep 12</text>
<rect x="150" y="144" width="315" height="53" fill="#CE2426"/>
<text x="165" y="169" font-family="sans-serif" font-size="19" font-weight="600" fill="#FFFFFF">Swim meet</text>
<text x="165" y="187" font-family="sans-serif" font-size="17" fill="#FFFFFF">All day</text>
<rect x="475" y="144" width="305" height="53" fill="#FFFFFF" stroke="#1DAD23" stroke-width="1"/>
<text x="490" y="177" font-family="sans-serif" font-size="20" fill="#1DAD23">Free</text>

<text x="20" y="237" font-family="sans-serif" font-size="20" fill="#000000">Sep 19</text>
<rect x="150" y="204" width="315" height="53" fill="#FFFFFF" stroke="#1DAD23" stroke-width="1"/>
<text x="165" y="237" font-family="sans-serif" font-size="20" fill="#1DAD23">Free</text>
<rect x="475" y="204" width="305" height="53" fill="#FFFFFF" stroke="#1DAD23" stroke-width="1"/>
<text x="490" y="237" font-family="sans-serif" font-size="20" fill="#1DAD23">Free</text>

<!-- Partly: outline treatment while RoleMap.warn_is_solid stays false. -->
<text x="20" y="296" font-family="sans-serif" font-size="20" fill="#000000">Sep 26</text>
<rect x="151" y="264" width="313" height="51" fill="#FFFFFF" stroke="#E8DE24" stroke-width="2"/>
<text x="165" y="288" font-family="sans-serif" font-size="19" font-weight="600" fill="#000000">Cheer competition</text>
<text x="165" y="306" font-family="sans-serif" font-size="17" fill="#000000">Morning only</text>
<rect x="475" y="263" width="305" height="53" fill="#FFFFFF" stroke="#1DAD23" stroke-width="1"/>
<text x="490" y="296" font-family="sans-serif" font-size="20" fill="#1DAD23">Free</text>

<text x="20" y="356" font-family="sans-serif" font-size="20" fill="#000000">Oct 3</text>
<rect x="150" y="323" width="630" height="53" fill="#CE2426"/>
<text x="165" y="348" font-family="sans-serif" font-size="19" font-weight="600" fill="#FFFFFF">Tahoe with the Silvas</text>
<text x="165" y="366" font-family="sans-serif" font-size="17" fill="#FFFFFF">Fri night to Sun</text>

<text x="20" y="415" font-family="sans-serif" font-size="20" fill="#000000">Oct 10</text>
<rect x="150" y="382" width="315" height="53" fill="#FFFFFF" stroke="#1DAD23" stroke-width="1"/>
<text x="165" y="415" font-family="sans-serif" font-size="20" fill="#1DAD23">Free</text>
<rect x="475" y="382" width="305" height="53" fill="#FFFFFF" stroke="#1DAD23" stroke-width="1"/>
<text x="490" y="415" font-family="sans-serif" font-size="20" fill="#1DAD23">Free</text>

<text x="20" y="449" font-family="sans-serif" font-size="16" fill="#000000">Accent date = long weekend</text>
<line x1="20" y1="453" x2="780" y2="453" stroke="#000000" stroke-width="1"/>
<text x="780" y="471" font-family="sans-serif" font-size="16" fill="#000000" text-anchor="end">Synced thu 6:30 am</text>
</svg>
